name: Validate packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18,<5"
      - name: Validator self-test
        run: python tools/test_validator.py
      - name: Validate every pack
        run: python tools/validate.py
      - name: Index is up to date
        run: python tools/build_index.py --check
